name: Deploy Astro to Scaleway
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

      - name: check conf
        run: |
          echo ${{ env.SCW_BUCKET }}
          echo ${{ envs.SCW_REGION }}