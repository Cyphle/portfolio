[package]
name = "contact-form-deploy"
version = "0.1.0"
edition = "2021"
description = "Script de déploiement Rust pour l'infrastructure de formulaire de contact AWS"
authors = ["Votre Nom <votre.email@exemple.com>"]
license = "MIT"
keywords = ["aws", "terraform", "deployment", "infrastructure", "contact-form"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "deploy"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Colored output
colored = "2.1"

# HTTP client pour les tests (optionnel)
reqwest = { version = "0.11", features = ["json"], optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }

# Logging (optionnel)
log = { version = "0.4", optional = true }
env_logger = { version = "0.10", optional = true }

[features]
default = []
http = ["reqwest", "tokio"]
logging = ["log", "env_logger"]
full = ["http", "logging"]

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

# Configuration pour des builds plus rapides en développement
[profile.dev.package."*"]
opt-level = 3